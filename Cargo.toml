[package]
name = "diffpatch"
version = "0.1.0"
edition = "2021"

[dependencies]
blake3 = "1"
serde_json = "1"

[profile.dev]
opt-level = 0
debug = true
lto = false
codegen-units = 256
panic = "unwind"
incremental = true

[profile.release]
opt-level = 3
debug = false
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
strip = true

[profile.dist]
inherits = "release"
opt-level = "z"
